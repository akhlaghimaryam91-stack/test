name: Publish Avina Salon Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the published demo
        run: |
          mkdir -p public
          wget --mirror --convert-links --adjust-extension --page-requisites --no-parent --directory-prefix=mirror "https://avina-salon-demo.akhlaghimaryam91.chatgpt.site/"
          cp -r mirror/avina-salon-demo.akhlaghimaryam91.chatgpt.site/. public/
          touch public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
